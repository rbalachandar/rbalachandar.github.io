<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="The verdict rule: validated, abstained or refuted from the interval against the gate">
<title>The verdict rule: validated, abstained or refuted from the interval against the gate</title>
<rect width="1200" height="520" fill="#090c12"/>
<text x="30" y="36" font-size="13.5" fill="#8f9ab0" font-weight="400" font-family="-apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif" text-anchor="start">One rule, fixed before the experiment. It reads the 95% interval, never a point estimate alone.</text>
<path d="M150 96 L950 96" stroke="#2a3550" stroke-width="1.4" fill="none"/>
<text x="150" y="84" font-size="11.5" fill="#5d6882" font-weight="400" font-family="-apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif" text-anchor="start">lower IC50 is better</text>
<text x="950" y="84" font-size="11.5" fill="#5d6882" font-weight="400" font-family="-apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif" text-anchor="end">higher</text>
<rect x="150" y="104" width="410" height="318" fill="#14233f" opacity=".45"/>
<path d="M560 100 L560 430" stroke="#e0ac24" stroke-width="1.4" fill="none" stroke-dasharray="5 4"/>
<text x="568" y="118" font-size="12" fill="#e0ac24" font-weight="400" font-family="-apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif" text-anchor="start">gate, registered beforehand</text>
<path d="M250 150 L420 150" stroke="#5b8def" stroke-width="1.4" fill="none"/>
<path d="M250 142 L250 158" stroke="#5b8def" stroke-width="1.4" fill="none"/>
<path d="M420 142 L420 158" stroke="#5b8def" stroke-width="1.4" fill="none"/>
<circle cx="335" cy="150" r="6" fill="#5b8def"/>
<text x="30" y="155" font-size="14" fill="#5b8def" font-weight="600" font-family="-apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif" text-anchor="start">Validated</text>
<text x="250" y="180" font-size="12" fill="#8f9ab0" font-weight="400" font-family="-apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif" text-anchor="start">interval fully inside the gate</text>
<path d="M440 240 L700 240" stroke="#aeb6c8" stroke-width="1.4" fill="none"/>
<path d="M440 232 L440 248" stroke="#aeb6c8" stroke-width="1.4" fill="none"/>
<path d="M700 232 L700 248" stroke="#aeb6c8" stroke-width="1.4" fill="none"/>
<path d="M570 232 L578 240 L570 248 L562 240 Z" fill="#090c12" stroke="#aeb6c8" stroke-width="1.6"/>
<text x="30" y="245" font-size="14" fill="#aeb6c8" font-weight="600" font-family="-apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif" text-anchor="start">Abstained</text>
<text x="574" y="270" font-size="12" fill="#8f9ab0" font-weight="400" font-family="-apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif" text-anchor="start">interval straddles the gate: no claim</text>
<path d="M700 330 L880 330" stroke="#e8604c" stroke-width="1.4" fill="none"/>
<path d="M700 322 L700 338" stroke="#e8604c" stroke-width="1.4" fill="none"/>
<path d="M880 322 L880 338" stroke="#e8604c" stroke-width="1.4" fill="none"/>
<rect x="784" y="324" width="12" height="12" fill="#e8604c"/>
<text x="30" y="335" font-size="14" fill="#e8604c" font-weight="600" font-family="-apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif" text-anchor="start">Refuted</text>
<text x="700" y="360" font-size="12" fill="#8f9ab0" font-weight="400" font-family="-apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif" text-anchor="start">interval fully outside the gate</text>
<text x="30" y="436" font-size="12" fill="#8f9ab0" font-weight="400" font-family="-apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif" text-anchor="start">Also abstains: QC failed, fewer than 3 replicates,</text>
<text x="30" y="454" font-size="12" fill="#8f9ab0" font-weight="400" font-family="-apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif" text-anchor="start">or a call that rests on an inferred top plateau.</text>
<rect x="30" y="468" width="1140" height="36" fill="#121926" stroke="#2a3550" stroke-width="1"/>
<text x="44" y="493" font-size="14.5" fill="#e8ecf4" font-weight="600" font-family="-apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif" text-anchor="start">After the verdict: a validated hit goes to an orthogonal assay, an abstention goes to a person.</text>
</svg>
